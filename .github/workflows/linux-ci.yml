name: Linux CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Swift 6.4 on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Swift Docker Image
        run: docker pull swift:6.4

      - name: Show Swift Version
        run: |
          docker run --rm swift:6.4 swift --version

      - name: Resolve Dependencies
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            swift:6.4 \
            swift package resolve

      - name: Build
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            swift:6.4 \
            swift build

      - name: Test
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            swift:6.4 \
            swift test

  verify-generated:
    name: Generated sources in sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Swift Docker Image
        run: docker pull swift:6.4

      # Generation reads the committed documentation snapshot and never the
      # network, so this is a pure reproducibility check: regenerating must
      # produce exactly what is committed.
      - name: Regenerate and diff
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            swift:6.4 \
            bash -c 'Scripts/generate-api.sh && git config --global --add safe.directory /workspace && git diff --exit-code -- botapi Sources/TelegramBotAPI/Generated Sources/TelegramBotKit/Generated'

      - name: Generator Tests
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            swift:6.4 \
            swift test --package-path Tooling/BotAPIGen
